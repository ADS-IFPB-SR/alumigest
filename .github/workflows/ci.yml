name: CI Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  # ==========================================
  # BACKEND CI
  # ==========================================
  backend-ci:
    name: Backend CI (Spring Boot)
    runs-on: ubuntu-latest
    
    # Executa apenas se houver alterações na pasta backend
    # Se quiser que sempre rode, pode remover essas 3 linhas
    # paths:
    #  - 'backend/**'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full clone necessário para análise SonarQube (código novo vs existente)

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: |
          cd backend
          chmod +x ./mvnw

      - name: Run Checkstyle
        run: |
          cd backend
          ./mvnw checkstyle:check

      - name: Build and Test Backend
        run: |
          cd backend
          ./mvnw clean verify

      # ---- SonarQube Analysis ----
      - name: SonarQube Analysis (Backend)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          cd backend
          ./mvnw org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=alumigest-backend \
            -Dsonar.projectName="AlumiGest Backend" \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.java.coveragePlugin=jacoco \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

  # ==========================================
  # FRONTEND CI
  # ==========================================
  frontend-ci:
    name: Frontend CI (React + Vite)
    runs-on: ubuntu-latest
    
    # Executa apenas se houver alterações na pasta frontend
    # paths:
    #  - 'frontend/**'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full clone necessário para análise SonarQube (código novo vs existente)

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run linter (Oxlint)
        run: |
          cd frontend
          npm run lint

      # Nota: A execução de testes (npm test) foi removida, 
      # pois não há script de testes configurado no package.json atualmente.

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      # ---- SonarQube Analysis ----
      - name: SonarQube Analysis (Frontend)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: sonarsource/sonarqube-scan-action@v4
        with:
          projectBaseDir: frontend/
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
