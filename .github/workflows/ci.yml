name: CI Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # ==========================================
  # BACKEND CI
  # ==========================================
  backend-ci:
    name: Backend CI (Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full clone necessário para análise SonarQube

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: |
          cd backend
          chmod +x ./mvnw

      - name: Run Checkstyle
        run: |
          cd backend
          ./mvnw checkstyle:check

      - name: Build and Test Backend
        run: |
          cd backend
          ./mvnw clean verify

      - name: Upload Backend Test & Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-backend
          path: |
            backend/target/surefire-reports/TEST-*.xml
            backend/target/site/jacoco/jacoco.csv
          retention-days: 2

      # Salva o JAR executável para reuso imediato nos testes E2E
      - name: Upload Backend Executable JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/alumigest-*.jar
          retention-days: 1

      # ---- SonarQube Analysis ----
      - name: SonarQube Analysis (Backend)
        if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          cd backend
          ./mvnw org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=alumigest-backend \
            -Dsonar.projectName="AlumiGest Backend" \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.java.coveragePlugin=jacoco \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.coverage.exclusions="**/dto/**,**/domain/**,**/config/**,**/exception/**,**/br/edu/ifpb/alumigest/AlumiGestApplication.java" \
            -Dsonar.qualitygate.wait=true

  # ==========================================
  # FRONTEND CI
  # ==========================================
  frontend-ci:
    name: Frontend CI (React + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run linter (Oxlint)
        run: |
          cd frontend
          npm run lint

      - name: Run Tests with Coverage (Vitest)
        run: |
          cd frontend
          npm run test:coverage

      - name: Upload Frontend Test & Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-frontend
          path: |
            frontend/coverage/coverage-summary.json
            frontend/coverage/vitest-report.xml
          retention-days: 2

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      # ---- SonarQube Analysis ----
      - name: SonarQube Analysis (Frontend)
        if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: sonarsource/sonarqube-scan-action@v4
        with:
          projectBaseDir: frontend/
          args: >
            -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # ==========================================
  # E2E TESTS (CYPRESS EM 5 JOBS PARALELOS)
  # ==========================================
  e2e-tests:
    name: "E2E: ${{ matrix.module_name }}"
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    timeout-minutes: 15

    # Service Container nativo do PostgreSQL com porta dinâmica para evitar colisões
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: alumigest_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - module: budgets
            module_name: Orçamentos
            spec_pattern: "cypress/e2e/budgets/**/*.cy.ts"
          - module: catalog
            module_name: Catálogo
            spec_pattern: "cypress/e2e/catalog/**/*.cy.ts"
          - module: orders
            module_name: Pedidos & Produção
            spec_pattern: "cypress/e2e/orders/**/*.cy.ts"
          - module: customers
            module_name: Clientes (Hub 360°)
            spec_pattern: "cypress/e2e/customers/**/*.cy.ts"
          - module: part-sales
            module_name: Venda Avulsa
            spec_pattern: "cypress/e2e/part-sales/**/*.cy.ts"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download Backend JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar

      - name: Start Backend API (Spring Boot)
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          JAR_FILE=$(find . -maxdepth 2 -name "alumigest-*.jar" ! -name "*.original" | head -n 1)
          echo "JAR localizado: $JAR_FILE"
          echo "Iniciando Spring Boot conectado ao PostgreSQL na porta $POSTGRES_PORT..."
          nohup java -Duser.timezone=America/Sao_Paulo -jar "$JAR_FILE" \
            --spring.profiles.active=dev \
            --spring.datasource.url="jdbc:postgresql://localhost:$POSTGRES_PORT/alumigest_e2e" \
            --spring.datasource.username=postgres \
            --spring.datasource.password=postgres \
            --server.port=8081 > backend.log 2>&1 &

      - name: Wait for Backend to be Healthy
        run: |
          echo "⏳ Aguardando Backend responder em http://localhost:8081/v3/api-docs..."
          for i in $(seq 1 45); do
            if curl -sf http://localhost:8081/v3/api-docs > /dev/null 2>&1; then
              echo "✅ Backend online com sucesso na tentativa $i!"
              exit 0
            fi
            sleep 2
          done
          echo "❌ Backend falhou ao inicializar dentro do tempo limite!"
          echo "=== Conteúdo de backend.log ==="
          cat backend.log || true
          exit 1

      - name: Load E2E CI Database Seeds
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          if ! command -v psql > /dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql-client
          fi
          echo "🌱 Carregando massa de dados mínima e idempotente para E2E..."
          PGPASSWORD=postgres psql -h localhost -p "$POSTGRES_PORT" -U postgres -d alumigest_e2e -v ON_ERROR_STOP=1 -f database/seeds/e2e_ci_seeds.sql

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Start Frontend (Vite)
        run: |
          cd frontend
          nohup npm run dev -- --host 127.0.0.1 --port 5173 > ../vite.log 2>&1 &

      - name: Wait for Frontend to be Healthy
        run: |
          echo "⏳ Aguardando Frontend responder em http://127.0.0.1:5173..."
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5173 > /dev/null 2>&1; then
              echo "✅ Frontend online com sucesso na tentativa $i!"
              exit 0
            fi
            sleep 1
          done
          echo "❌ Frontend falhou ao inicializar dentro do tempo limite!"
          echo "=== Conteúdo de vite.log ==="
          cat vite.log || true
          exit 1

      - name: Run Cypress E2E — ${{ matrix.module_name }}
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          install: false
          spec: ${{ matrix.spec_pattern }}
        env:
          CYPRESS_BASE_URL: http://127.0.0.1:5173
          CYPRESS_API_URL: http://localhost:8081/api/v1
          CYPRESS_VIDEO: true
          CYPRESS_SCREENSHOT_ON_RUN_FAILURE: true

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence-${{ matrix.module }}
          path: |
            frontend/cypress/screenshots/
            frontend/cypress/videos/
          retention-days: 5

      - name: Dump Service logs on failure
        if: failure()
        run: |
          echo "=== Backend Log (últimas 200 linhas) ==="
          cat backend.log | tail -n 200 || true
          echo "=== Vite Log (últimas 100 linhas) ==="
          cat vite.log | tail -n 100 || true

      - name: Stop Background Services
        if: always()
        run: |
          pkill -f "java.*alumigest" || true
          pkill -f "vite" || true

  # ==========================================
  # PULL REQUEST REPORT (STICKY COMMENT UNIFICADO)
  # ==========================================
  ci-report:
    name: Post CI Report to PR
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, e2e-tests]
    if: always() && github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Backend Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: artifacts-backend
          path: artifacts-backend

      - name: Download Frontend Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: artifacts-frontend
          path: artifacts-frontend

      - name: Generate and Post PR Comment
        uses: actions/github-script@v7
        env:
          BACKEND_STATUS: ${{ needs.backend-ci.result }}
          FRONTEND_STATUS: ${{ needs.frontend-ci.result }}
          E2E_STATUS: ${{ needs.e2e-tests.result }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          script: |
            const generateReport = require('./.github/scripts/generate-ci-report.cjs');
            await generateReport({ github, context, core });

  # ==========================================
  # DEPLOY DEVELOP (COOLIFY)
  # ==========================================
  deploy-develop:
    name: Deploy to Coolify (Develop)
    needs: [backend-ci, frontend-ci, e2e-tests]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify Deployment
        continue-on-error: true
        run: |
          echo "Disparando deploy automatico da branch develop no Coolify..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "http://167.234.240.156:8000/api/v1/deploy?uuid=hbhtyinnqhlgobcrfoxmxc6f&force=true" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}")

          HTTP_BODY=$(echo "$RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d':' -f2)

          echo "Resposta do Coolify:"
          echo "$HTTP_BODY"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Deploy disparado com sucesso no Coolify (HTTP $HTTP_STATUS)!"
          else
            echo "::warning title=Falha no Deploy Coolify::Erro ao disparar deploy no Coolify (HTTP $HTTP_STATUS): $HTTP_BODY. Verifique se o COOLIFY_TOKEN possui a permissão 'deploy'."
            echo "Erro ao disparar deploy no Coolify (HTTP $HTTP_STATUS)!"
            exit 1
          fi
