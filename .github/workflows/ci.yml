name: CI Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  # ==========================================
  # BACKEND CI
  # ==========================================
  backend-ci:
    name: Backend CI (Spring Boot)
    runs-on: ubuntu-latest
    
    # Executa apenas se houver alterações na pasta backend
    # Se quiser que sempre rode, pode remover essas 3 linhas
    # paths:
    #  - 'backend/**'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full clone necessário para análise SonarQube (código novo vs existente)

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: |
          cd backend
          chmod +x ./mvnw

      - name: Run Checkstyle
        run: |
          cd backend
          ./mvnw checkstyle:check

      - name: Build and Test Backend
        run: |
          cd backend
          ./mvnw clean verify

      # ---- SonarQube Analysis ----
      - name: SonarQube Analysis (Backend)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          cd backend
          ./mvnw org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=alumigest-backend \
            -Dsonar.projectName="AlumiGest Backend" \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.java.coveragePlugin=jacoco \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.coverage.exclusions="**/dto/**,**/domain/**,**/config/**,**/exception/**,**/br/edu/ifpb/alumigest/AlumiGestApplication.java"

  # ==========================================
  # FRONTEND CI
  # ==========================================
  frontend-ci:
    name: Frontend CI (React + Vite)
    runs-on: ubuntu-latest
    
    # Executa apenas se houver alterações na pasta frontend
    # paths:
    #  - 'frontend/**'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full clone necessário para análise SonarQube (código novo vs existente)

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run linter (Oxlint)
        run: |
          cd frontend
          npm run lint

      - name: Run Tests with Coverage (Vitest)
        run: |
          cd frontend
          npm run test:coverage

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      # ---- SonarQube Analysis ----
      - name: SonarQube Analysis (Frontend)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: sonarsource/sonarqube-scan-action@v4
        with:
          projectBaseDir: frontend/
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # ==========================================
  # DEPLOY DEVELOP (COOLIFY)
  # ==========================================
  deploy-develop:
    name: Deploy to Coolify (Develop)
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify Deployment
        run: |
          echo "Disparando deploy automatico da branch develop no Coolify..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "http://167.234.240.156:8000/api/v1/deploy?uuid=hbhtyinnqhlgobcrfoxmxc6f&force=true" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}")

          HTTP_BODY=$(echo "$RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d':' -f2)

          echo "Resposta do Coolify:"
          echo "$HTTP_BODY"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Deploy disparado com sucesso no Coolify (HTTP $HTTP_STATUS)!"
          else
            echo "Erro ao disparar deploy no Coolify (HTTP $HTTP_STATUS)!"
            exit 1
          fi

