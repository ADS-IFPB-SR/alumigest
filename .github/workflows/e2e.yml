# ==========================================
# AlumiGest E2E — Testes End-to-End com Cypress
# Utiliza Service Containers nativos do GitHub Actions
# Roda na merge_group (fila de merge) antes do merge na develop
# ==========================================
name: E2E Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # ==========================================
  # BUILD: Constrói o artefato JAR do Backend
  # ==========================================
  build-backend:
    name: Build Backend JAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: |
          cd backend
          chmod +x ./mvnw

      - name: Build Backend JAR (sem testes)
        run: |
          cd backend
          ./mvnw clean package -DskipTests

      - name: Upload Backend JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 1

  # ==========================================
  # E2E: Testes paralelos por módulo
  # ==========================================
  e2e-tests:
    name: "E2E: ${{ matrix.module_name }}"
    runs-on: ubuntu-latest
    needs: build-backend
    timeout-minutes: 20

    # Service Container nativo do GitHub Actions
    # Porta mapeada dinamicamente pelo GitHub para eliminar 100% o risco de conflito de portas
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: alumigest_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - module: budgets
            module_name: Orçamentos
            spec_pattern: "cypress/e2e/budgets/**/*.cy.ts"
          - module: catalog
            module_name: Catálogo
            spec_pattern: "cypress/e2e/catalog/**/*.cy.ts"
          - module: orders
            module_name: Pedidos & Produção
            spec_pattern: "cypress/e2e/orders/**/*.cy.ts"
          - module: customers
            module_name: Clientes (Hub 360°)
            spec_pattern: "cypress/e2e/customers/**/*.cy.ts"
          - module: part-sales
            module_name: Venda Avulsa
            spec_pattern: "cypress/e2e/part-sales/**/*.cy.ts"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download Backend JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend-jar

      - name: Start Backend API (Spring Boot)
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          echo "Iniciando Spring Boot conectado ao PostgreSQL nativo na porta dinâmica $POSTGRES_PORT..."
          nohup java -Duser.timezone=America/Sao_Paulo -jar backend-jar/*.jar \
            --spring.profiles.active=dev \
            --POSTGRES_HOST=localhost \
            --POSTGRES_PORT=$POSTGRES_PORT \
            --POSTGRES_DB=alumigest_e2e \
            --POSTGRES_USER=postgres \
            --POSTGRES_PASSWORD=postgres \
            --SERVER_PORT=8081 > backend.log 2>&1 &

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Executa Cypress via GitHub Action Oficial do Cypress
      # Gerencia o ciclo de vida do Vite, espera o backend e frontend ficarem saudáveis,
      # e executa a suíte de testes de forma limpa e nativa
      - name: Run Cypress E2E — ${{ matrix.module_name }}
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          start: npm run dev -- --port 5173
          wait-on: 'http://localhost:5173, http://localhost:8081/v3/api-docs'
          wait-on-timeout: 120
          spec: ${{ matrix.spec_pattern }}
        env:
          CYPRESS_BASE_URL: http://localhost:5173
          CYPRESS_API_URL: http://localhost:8081/api/v1
          CYPRESS_VIDEO: true
          CYPRESS_SCREENSHOT_ON_RUN_FAILURE: true

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence-${{ matrix.module }}
          path: |
            frontend/cypress/screenshots/
            frontend/cypress/videos/
          retention-days: 5

      - name: Dump Backend logs on failure
        if: failure()
        run: |
          echo "=== Backend Log (últimas 200 linhas) ==="
          cat backend.log | tail -n 200

      - name: Stop Backend
        if: always()
        run: |
          pkill -f "java.*backend-jar" || true

  # ==========================================
  # RESULTADO CONSOLIDADO + RELATÓRIO
  # ==========================================
  e2e-result:
    name: E2E Result
    runs-on: ubuntu-latest
    needs: e2e-tests
    if: always()
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Collect module results
        id: collect
        run: |
          E2E_RESULT="${{ needs.e2e-tests.result }}"
          echo "e2e_status=$E2E_RESULT" >> $GITHUB_OUTPUT

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "run_url=$RUN_URL" >> $GITHUB_OUTPUT

      - name: Post E2E sticky comment on PR
        uses: actions/github-script@v7
        env:
          E2E_STATUS: ${{ steps.collect.outputs.e2e_status }}
          E2E_RUN_URL: ${{ steps.collect.outputs.run_url }}
        with:
          script: |
            const e2eStatus = process.env.E2E_STATUS || 'unknown';
            const e2eRunUrl = process.env.E2E_RUN_URL || '';
            const commitSha = context.sha ? context.sha.substring(0, 7) : 'N/A';

            const statusBadge = e2eStatus === 'success'
              ? '### 🟢 Todos os Testes E2E Passaram'
              : '### 🔴 Falhas Detectadas nos Testes E2E';

            const modules = [
              { name: 'Orçamentos', key: 'budgets' },
              { name: 'Catálogo', key: 'catalog' },
              { name: 'Pedidos & Produção', key: 'orders' },
              { name: 'Clientes (Hub 360°)', key: 'customers' },
              { name: 'Venda Avulsa', key: 'part-sales' }
            ];

            let markdown = `## 🧪 AlumiGest E2E — Relatório de Testes End-to-End\n\n`;
            markdown += `${statusBadge}\n\n`;
            markdown += `> Commit: \`${commitSha}\` | [Ver Execução E2E](${e2eRunUrl})\n\n`;
            markdown += `| Módulo | Job |\n`;
            markdown += `| :--- | :---: |\n`;

            for (const mod of modules) {
              markdown += `| ${mod.name} | [Ver resultado](${e2eRunUrl}) |\n`;
            }

            if (e2eStatus === 'failure') {
              markdown += `\n> ⚠️ **Screenshots e vídeos** estão disponíveis como artifacts nos jobs que falharam.\n`;
            }

            markdown += `\n---\n`;
            markdown += `*Relatório E2E gerado automaticamente pelo GitHub Actions em ${new Date().toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo' })}*\n`;
            markdown += `<!-- alumigest-e2e-report -->\n`;

            let prNumber = context.payload?.pull_request?.number || context.issue?.number;
            if (!prNumber) {
              const headRef = context.payload?.merge_group?.head_ref || '';
              const prMatch = headRef.match(/pr-(\d+)/);
              if (prMatch) {
                prNumber = parseInt(prMatch[1], 10);
              }
            }

            if (prNumber) {
              try {
                const { data: comments } = await github.rest.issues.listComments({
                  ...context.repo,
                  issue_number: prNumber
                });

                const existing = comments.find(c => c.body && c.body.includes('<!-- alumigest-e2e-report -->'));

                if (existing) {
                  await github.rest.issues.updateComment({
                    ...context.repo,
                    comment_id: existing.id,
                    body: markdown
                  });
                  console.log(`Comentário E2E atualizado no PR #${prNumber}`);
                } else {
                  await github.rest.issues.createComment({
                    ...context.repo,
                    issue_number: prNumber,
                    body: markdown
                  });
                  console.log(`Comentário E2E criado no PR #${prNumber}`);
                }
              } catch (err) {
                console.error(`Erro ao postar no PR #${prNumber}:`, err.message);
              }
            } else {
              console.log('Nenhum PR associado detectado. Relatório exibido no log:');
              console.log(markdown);
            }

      - name: Fail if E2E tests failed
        if: needs.e2e-tests.result != 'success'
        run: |
          echo "🔴 Falhas detectadas nos testes E2E."
          echo "Verifique os artifacts de evidência (screenshots/vídeos) nos jobs que falharam."
          exit 1
