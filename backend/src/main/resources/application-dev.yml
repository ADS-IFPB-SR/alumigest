spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

security:
  jwt:
    # Segredo EXCLUSIVO para desenvolvimento local; em producao informe JWT_SECRET.
    secret: ${JWT_SECRET:alumigest-dev-only-jwt-secret-key-0123456789-change-in-prod}

logging:
  level:
    root: INFO
    br.edu.ifpb.alumigest: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
