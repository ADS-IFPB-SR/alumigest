server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /

spring:
  application:
    name: alumigest-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5435}/${POSTGRES_DB:alumigest_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

empresa:
  razao-social: ${EMPRESA_RAZAO_SOCIAL:Alumiportas LTDA}
  cnpj: ${EMPRESA_CNPJ:00.000.000/0000-00}
  inscricao-estadual: ${EMPRESA_IE:Isento}
  telefone: ${EMPRESA_TELEFONE:(83) 99999-9999}
  endereco: ${EMPRESA_ENDERECO:Rua Principal, 100 - Centro}
  cidade-uf: ${EMPRESA_CIDADE_UF:Sousa - PB}