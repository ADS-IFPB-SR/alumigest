# 1. Alias para o H2 entender o tipo JSONB do PostgreSQL como VARCHAR
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE DOMAIN IF NOT EXISTS JSONB AS VARCHAR;

# 2. Força o Hibernate a gerar as tabelas e usar o dialeto correto
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# 3. Garante que o Flyway (migrações) não vai tentar rodar no H2
spring.flyway.enabled=false
