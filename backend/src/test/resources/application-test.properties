# 1. Alias para o H2 entender o tipo JSONB do PostgreSQL como VARCHAR
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE DOMAIN IF NOT EXISTS JSONB AS VARCHAR;

# 2. Forca o Hibernate a gerar as tabelas e usar o dialeto correto
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# 3. Garante que o Flyway (migracoes) nao vai tentar rodar no H2
spring.flyway.enabled=false

# 4. Dados ficticios da empresa para o contexto de testes automatizados
empresa.razao-social=Empresa de Teste LTDA
empresa.cnpj=00.000.000/0000-00
empresa.inscricao-estadual=00000000
empresa.telefone=(00) 0000-0000
empresa.endereco=Rua de Teste, 100 - Centro
empresa.cidade-uf=Cidade - UF
