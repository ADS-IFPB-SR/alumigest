# 1. Alias para o H2 entender o tipo JSONB do PostgreSQL como VARCHAR
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE DOMAIN IF NOT EXISTS JSONB AS VARCHAR;

# 2. Pool Hikari dimensionado para testes multi-thread de concorrencia
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# 3. Forca o Hibernate a gerar as tabelas e usar o dialeto correto
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# 4. Garante que o Flyway (migracoes) nao vai tentar rodar no H2
spring.flyway.enabled=false

# 5. Dados ficticios da empresa para o contexto de testes automatizados
empresa.razao-social=Empresa de Teste LTDA
empresa.cnpj=00.000.000/0000-00
empresa.inscricao-estadual=00000000
empresa.telefone=(00) 0000-0000
empresa.endereco=Rua de Teste, 100 - Centro
empresa.cidade-uf=Cidade - UF

# 6. Segredo JWT exclusivo para testes automatizados (US-48.1)
security.jwt.secret=alumigest-test-only-jwt-secret-key-0123456789-abcdef
security.jwt.expiration=8h
