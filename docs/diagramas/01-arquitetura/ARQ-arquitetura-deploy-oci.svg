<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title -->
  <text x="30" y="35" fill="white" font-size="16" font-weight="700">Arquitetura de Deploy — AlumiGest</text>
  <text x="30" y="52" fill="#94a3b8" font-size="9">OCI (Oracle Cloud Infrastructure) + Coolify + Docker Containers</text>

  <!-- ======== ROW 1: CLIENTS ======== -->
  <!-- Browser -->
  <rect x="180" y="80" width="150" height="55" rx="6" fill="#0f172a"/>
  <rect x="180" y="80" width="150" height="55" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="255" y="104" fill="white" font-size="11" font-weight="600" text-anchor="middle">Navegador Web</text>
  <text x="255" y="120" fill="#94a3b8" font-size="9" text-anchor="middle">Desktop / Laptop</text>

  <!-- PWA Mobile -->
  <rect x="400" y="80" width="150" height="55" rx="6" fill="#0f172a"/>
  <rect x="400" y="80" width="150" height="55" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="475" y="104" fill="white" font-size="11" font-weight="600" text-anchor="middle">PWA Mobile</text>
  <text x="475" y="120" fill="#94a3b8" font-size="9" text-anchor="middle">Celular / Tablet</text>

  <!-- API Client -->
  <rect x="620" y="80" width="150" height="55" rx="6" fill="#0f172a"/>
  <rect x="620" y="80" width="150" height="55" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="695" y="104" fill="white" font-size="11" font-weight="600" text-anchor="middle">Swagger UI</text>
  <text x="695" y="120" fill="#94a3b8" font-size="9" text-anchor="middle">API Testing</text>

  <!-- Arrows from clients to DNS -->
  <line x1="255" y1="135" x2="255" y2="175" stroke="#22d3ee" stroke-width="1.2" marker-end="url(#arrow-cyan)"/>
  <line x1="475" y1="135" x2="475" y2="175" stroke="#22d3ee" stroke-width="1.2" marker-end="url(#arrow-cyan)"/>
  <line x1="695" y1="135" x2="695" y2="175" stroke="#22d3ee" stroke-width="1.2" marker-end="url(#arrow-cyan)"/>

  <!-- ======== ROW 2: DNS + SSL ======== -->
  <rect x="150" y="175" width="670" height="50" rx="8" fill="#0f172a"/>
  <rect x="150" y="175" width="670" height="50" rx="8" fill="rgba(136,19,55,0.3)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="485" y="200" fill="white" font-size="11" font-weight="600" text-anchor="middle">DNS + Let's Encrypt SSL (HTTPS)</text>
  <text x="485" y="215" fill="#94a3b8" font-size="9" text-anchor="middle">alumigest.alumiportas.com.br → IP OCI | Certificado TLS auto-renovado pelo Coolify</text>

  <!-- Arrow DNS to OCI -->
  <line x1="485" y1="225" x2="485" y2="265" stroke="#fb7185" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="500" y="248" fill="#94a3b8" font-size="8">HTTPS :443</text>

  <!-- ======== OCI REGION BOUNDARY ======== -->
  <rect x="40" y="265" width="1020" height="480" rx="12" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="12,4"/>
  <text x="55" y="282" fill="#fbbf24" font-size="10" font-weight="600">Oracle Cloud Infrastructure (OCI) — São Paulo Region</text>

  <!-- ======== VPC BOUNDARY ======== -->
  <rect x="60" y="295" width="980" height="435" rx="8" fill="none" stroke="#fb7185" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="75" y="310" fill="#fb7185" font-size="8" font-weight="500">VCN (Virtual Cloud Network) — 10.0.0.0/16</text>

  <!-- ======== COMPUTE INSTANCE ======== -->
  <rect x="80" y="320" width="940" height="395" rx="8" fill="none" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="6,3"/>
  <text x="95" y="336" fill="#94a3b8" font-size="8" font-weight="500">VM.Standard.A1.Flex — 4 OCPU / 24GB RAM (Always Free)</text>

  <!-- ======== COOLIFY ======== -->
  <rect x="100" y="350" width="900" height="80" rx="8" fill="#0f172a"/>
  <rect x="100" y="350" width="900" height="80" rx="8" fill="rgba(120,53,15,0.25)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="550" y="378" fill="white" font-size="13" font-weight="700" text-anchor="middle">Coolify — Gerenciador de Deploy</text>
  <text x="550" y="396" fill="#94a3b8" font-size="9" text-anchor="middle">Self-hosted PaaS | Auto-deploy via Webhook GitHub | Gerenciamento de containers, SSL, domínios e logs</text>
  <text x="550" y="412" fill="#fbbf24" font-size="8" text-anchor="middle">Dashboard: https://coolify.alumiportas.com.br</text>

  <!-- Arrow Coolify to Docker containers -->
  <line x1="300" y1="430" x2="300" y2="470" stroke="#fbbf24" stroke-width="1.2" marker-end="url(#arrow-amber)"/>
  <text x="310" y="455" fill="#94a3b8" font-size="7">docker compose up</text>
  <line x1="550" y1="430" x2="550" y2="470" stroke="#fbbf24" stroke-width="1.2" marker-end="url(#arrow-amber)"/>
  <line x1="800" y1="430" x2="800" y2="470" stroke="#fbbf24" stroke-width="1.2" marker-end="url(#arrow-amber)"/>

  <!-- ======== DOCKER CONTAINERS ======== -->
  <!-- Docker boundary -->
  <rect x="100" y="470" width="900" height="75" rx="6" fill="none" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="115" y="484" fill="#94a3b8" font-size="7" font-weight="500">Docker Engine — Containers</text>

  <!-- Traefik / Proxy -->
  <rect x="120" y="492" width="160" height="45" rx="6" fill="#0f172a"/>
  <rect x="120" y="492" width="160" height="45" rx="6" fill="rgba(136,19,55,0.3)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="200" y="512" fill="white" font-size="10" font-weight="600" text-anchor="middle">Traefik Proxy</text>
  <text x="200" y="526" fill="#94a3b8" font-size="8" text-anchor="middle">Reverse Proxy :80/:443</text>

  <!-- Frontend Container -->
  <rect x="320" y="492" width="180" height="45" rx="6" fill="#0f172a"/>
  <rect x="320" y="492" width="180" height="45" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="410" y="512" fill="white" font-size="10" font-weight="600" text-anchor="middle">Frontend Container</text>
  <text x="410" y="526" fill="#94a3b8" font-size="8" text-anchor="middle">TypeScript + PWA :3000</text>

  <!-- Backend Container -->
  <rect x="540" y="492" width="190" height="45" rx="6" fill="#0f172a"/>
  <rect x="540" y="492" width="190" height="45" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="635" y="512" fill="white" font-size="10" font-weight="600" text-anchor="middle">Backend Container</text>
  <text x="635" y="526" fill="#94a3b8" font-size="8" text-anchor="middle">Java 21 + Spring Boot :8080</text>

  <!-- PostgreSQL Container -->
  <rect x="770" y="492" width="210" height="45" rx="6" fill="#0f172a"/>
  <rect x="770" y="492" width="210" height="45" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="875" y="512" fill="white" font-size="10" font-weight="600" text-anchor="middle">PostgreSQL 16</text>
  <text x="875" y="526" fill="#94a3b8" font-size="8" text-anchor="middle">Banco de Dados :5432</text>

  <!-- Arrows between containers -->
  <line x1="280" y1="514" x2="318" y2="514" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="500" y1="514" x2="538" y2="514" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="510" y="507" fill="#94a3b8" font-size="7">REST API</text>
  <line x1="730" y1="514" x2="768" y2="514" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="740" y="507" fill="#94a3b8" font-size="7">JDBC</text>

  <!-- ======== VOLUMES / STORAGE ======== -->
  <!-- Arrow to volumes -->
  <line x1="875" y1="537" x2="875" y2="575" stroke="#a78bfa" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Volume: pgdata -->
  <rect x="770" y="575" width="210" height="45" rx="6" fill="#0f172a"/>
  <rect x="770" y="575" width="210" height="45" rx="6" fill="rgba(76,29,149,0.3)" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="875" y="596" fill="white" font-size="10" font-weight="600" text-anchor="middle">Docker Volume: pgdata</text>
  <text x="875" y="610" fill="#94a3b8" font-size="8" text-anchor="middle">Persistência de dados</text>

  <!-- Flyway -->
  <rect x="540" y="575" width="190" height="45" rx="6" fill="#0f172a"/>
  <rect x="540" y="575" width="190" height="45" rx="6" fill="rgba(6,78,59,0.3)" stroke="#34d399" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="635" y="596" fill="white" font-size="10" font-weight="600" text-anchor="middle">Flyway Migrations</text>
  <text x="635" y="610" fill="#94a3b8" font-size="8" text-anchor="middle">V001 a V014 (schema)</text>

  <line x1="635" y1="537" x2="635" y2="573" stroke="#34d399" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-emerald)"/>
  <text x="645" y="558" fill="#94a3b8" font-size="7">startup</text>

  <!-- Backup -->
  <rect x="120" y="575" width="180" height="45" rx="6" fill="#0f172a"/>
  <rect x="120" y="575" width="180" height="45" rx="6" fill="rgba(120,53,15,0.2)" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="210" y="596" fill="white" font-size="10" font-weight="600" text-anchor="middle">Backup Automático</text>
  <text x="210" y="610" fill="#94a3b8" font-size="8" text-anchor="middle">pg_dump diário → OCI Bucket</text>

  <!-- Arrow backup to pg -->
  <line x1="300" y1="597" x2="768" y2="597" stroke="#64748b" stroke-width="0.8" stroke-dasharray="6,3"/>

  <!-- ======== GITHUB (EXTERNAL) ======== -->
  <rect x="820" y="340" width="170" height="55" rx="6" fill="#0f172a"/>
  <rect x="820" y="340" width="170" height="55" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="905" y="364" fill="white" font-size="10" font-weight="600" text-anchor="middle">GitHub Repository</text>
  <text x="905" y="380" fill="#94a3b8" font-size="8" text-anchor="middle">Webhook → Coolify</text>

  <!-- Arrow GitHub to Coolify (already inside Coolify box context) -->

  <!-- ======== LEGEND ======== -->
  <rect x="40" y="660" width="1020" height="90" rx="8" fill="rgba(15,23,42,0.8)" stroke="#334155" stroke-width="0.8"/>
  <text x="60" y="680" fill="white" font-size="10" font-weight="600">Legenda</text>

  <!-- Legend items -->
  <rect x="60" y="692" width="14" height="10" rx="2" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
  <text x="80" y="701" fill="#94a3b8" font-size="8">Frontend / Cliente</text>

  <rect x="210" y="692" width="14" height="10" rx="2" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1"/>
  <text x="230" y="701" fill="#94a3b8" font-size="8">Backend / Serviço</text>

  <rect x="370" y="692" width="14" height="10" rx="2" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1"/>
  <text x="390" y="701" fill="#94a3b8" font-size="8">Banco de Dados</text>

  <rect x="530" y="692" width="14" height="10" rx="2" fill="rgba(120,53,15,0.25)" stroke="#fbbf24" stroke-width="1"/>
  <text x="550" y="701" fill="#94a3b8" font-size="8">Infraestrutura / Coolify</text>

  <rect x="740" y="692" width="14" height="10" rx="2" fill="rgba(136,19,55,0.3)" stroke="#fb7185" stroke-width="1"/>
  <text x="760" y="701" fill="#94a3b8" font-size="8">Segurança / Proxy</text>

  <rect x="920" y="692" width="14" height="10" rx="2" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1"/>
  <text x="940" y="701" fill="#94a3b8" font-size="8">Externo</text>

  <line x1="60" y1="720" x2="130" y2="720" stroke="#64748b" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="140" y="724" fill="#94a3b8" font-size="8">Boundary de rede</text>

  <line x1="280" y1="720" x2="350" y2="720" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="360" y="724" fill="#94a3b8" font-size="8">Fluxo de dados</text>

  <text x="550" y="724" fill="#94a3b8" font-size="8">Deploy: push main → GitHub Webhook → Coolify auto-deploy → Docker rebuild</text>
</svg>
