<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title -->
  <text x="30" y="35" fill="white" font-size="16" font-weight="700">ER — Módulo de Orçamentos (Transacional)</text>
  <text x="30" y="52" fill="#94a3b8" font-size="9">Desnormalização controlada (Snapshot Pattern): Copiar preços unitários para garantir histórico imutável</text>

  <!-- ======== ENTITY: clientes (top-left) ======== -->
  <g transform="translate(60, 80)">
    <rect width="280" height="185" rx="6" fill="#0f172a"/>
    <rect width="280" height="185" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <rect width="280" height="28" rx="6" fill="rgba(8,51,68,0.6)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="140" y="19" fill="white" font-size="11" font-weight="700" text-anchor="middle">clientes</text>
    <text x="12" y="48" fill="#fbbf24" font-size="8" font-weight="600">PK</text>
    <text x="35" y="48" fill="white" font-size="8" font-weight="600">id</text>
    <text x="180" y="48" fill="#94a3b8" font-size="7">BIGSERIAL</text>
    <text x="35" y="63" fill="#e2e8f0" font-size="8">nome_completo</text>
    <text x="180" y="63" fill="#94a3b8" font-size="7">VARCHAR(200) NN</text>
    <text x="12" y="78" fill="#22d3ee" font-size="8" font-weight="600">UK</text>
    <text x="35" y="78" fill="#e2e8f0" font-size="8">cpf_cnpj</text>
    <text x="180" y="78" fill="#94a3b8" font-size="7">VARCHAR(18) NN</text>
    <text x="35" y="93" fill="#e2e8f0" font-size="8">tipo_pessoa</text>
    <text x="180" y="93" fill="#34d399" font-size="7">ENUM NN</text>
    <text x="35" y="108" fill="#e2e8f0" font-size="8">telefone</text>
    <text x="180" y="108" fill="#94a3b8" font-size="7">VARCHAR(15) NN</text>
    <text x="35" y="123" fill="#e2e8f0" font-size="8">email</text>
    <text x="180" y="123" fill="#94a3b8" font-size="7">VARCHAR(150)</text>
    <text x="35" y="138" fill="#e2e8f0" font-size="8">endereco_json</text>
    <text x="180" y="138" fill="#94a3b8" font-size="7">JSONB</text>
    <text x="35" y="153" fill="#64748b" font-size="8">ativo, created_at, updated_at</text>
    <line x1="10" y1="163" x2="270" y2="163" stroke="#22d3ee" stroke-width="0.3"/>
    <text x="12" y="178" fill="#94a3b8" font-size="7">PK: id | UK: cpf_cnpj</text>
  </g>

  <!-- ======== ENTITY: orcamentos (center) ======== -->
  <g transform="translate(420, 80)">
    <rect width="320" height="230" rx="6" fill="#0f172a"/>
    <rect width="320" height="230" rx="6" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1.5"/>
    <rect width="320" height="28" rx="6" fill="rgba(251,146,60,0.5)" stroke="#fb923c" stroke-width="1.5"/>
    <text x="160" y="19" fill="white" font-size="11" font-weight="700" text-anchor="middle">orcamentos</text>
    <text x="12" y="48" fill="#fbbf24" font-size="8" font-weight="600">PK</text>
    <text x="35" y="48" fill="white" font-size="8" font-weight="600">id</text>
    <text x="210" y="48" fill="#94a3b8" font-size="7">BIGSERIAL</text>
    <text x="12" y="63" fill="#22d3ee" font-size="8" font-weight="600">UK</text>
    <text x="35" y="63" fill="#e2e8f0" font-size="8">numero</text>
    <text x="210" y="63" fill="#94a3b8" font-size="7">VARCHAR(20) NN</text>
    <text x="12" y="78" fill="#fb7185" font-size="8" font-weight="600">FK</text>
    <text x="35" y="78" fill="#e2e8f0" font-size="8">cliente_id</text>
    <text x="210" y="78" fill="#94a3b8" font-size="7">BIGINT NN</text>
    <text x="12" y="93" fill="#fb7185" font-size="8" font-weight="600">FK</text>
    <text x="35" y="93" fill="#e2e8f0" font-size="8">usuario_id</text>
    <text x="210" y="93" fill="#94a3b8" font-size="7">BIGINT NN (Vendedor)</text>
    <text x="35" y="108" fill="#e2e8f0" font-size="8">status</text>
    <text x="210" y="108" fill="#34d399" font-size="7">ENUM NN = RASCUNHO</text>
    <text x="35" y="123" fill="#e2e8f0" font-size="8">data_validade</text>
    <text x="210" y="123" fill="#94a3b8" font-size="7">DATE NN</text>
    <text x="35" y="138" fill="#e2e8f0" font-size="8">subtotal</text>
    <text x="210" y="138" fill="#94a3b8" font-size="7">NUMERIC(12,2) NN = 0</text>
    <text x="35" y="153" fill="#e2e8f0" font-size="8">desconto_percentual</text>
    <text x="210" y="153" fill="#94a3b8" font-size="7">NUMERIC(5,2) NN = 0</text>
    <text x="35" y="168" fill="#e2e8f0" font-size="8">valor_desconto</text>
    <text x="210" y="168" fill="#94a3b8" font-size="7">NUMERIC(12,2) NN = 0</text>
    <text x="35" y="183" fill="#e2e8f0" font-size="8">valor_total</text>
    <text x="210" y="183" fill="#94a3b8" font-size="7">NUMERIC(12,2) NN = 0</text>
    <text x="35" y="198" fill="#e2e8f0" font-size="8">observacoes</text>
    <text x="210" y="198" fill="#94a3b8" font-size="7">TEXT</text>
    <line x1="10" y1="208" x2="310" y2="208" stroke="#fb923c" stroke-width="0.3"/>
    <text x="12" y="223" fill="#94a3b8" font-size="7">PK: id | UK: numero | FKs: cliente_id, usuario_id</text>
  </g>

  <!-- Arrow clientes → orcamentos -->
  <line x1="340" y1="172" x2="420" y2="172" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="350" y="165" fill="#94a3b8" font-size="7">1</text>
  <text x="405" y="165" fill="#94a3b8" font-size="7">N</text>

  <!-- ======== ENTITY: itens_orcamento (bottom-center) ======== -->
  <g transform="translate(370, 370)">
    <rect width="420" height="280" rx="6" fill="#0f172a"/>
    <rect width="420" height="280" rx="6" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1.5"/>
    <rect width="420" height="28" rx="6" fill="rgba(251,146,60,0.5)" stroke="#fb923c" stroke-width="1.5"/>
    <text x="210" y="19" fill="white" font-size="11" font-weight="700" text-anchor="middle">itens_orcamento</text>
    <text x="12" y="48" fill="#fbbf24" font-size="8" font-weight="600">PK</text>
    <text x="35" y="48" fill="white" font-size="8" font-weight="600">id</text>
    <text x="250" y="48" fill="#94a3b8" font-size="7">BIGSERIAL</text>
    <text x="12" y="63" fill="#fb7185" font-size="8" font-weight="600">FK</text>
    <text x="35" y="63" fill="#e2e8f0" font-size="8">orcamento_id</text>
    <text x="250" y="63" fill="#94a3b8" font-size="7">BIGINT NN (ON DELETE CASCADE)</text>
    <text x="12" y="78" fill="#fb7185" font-size="8" font-weight="600">FK</text>
    <text x="35" y="78" fill="#e2e8f0" font-size="8">tipo_produto_id</text>
    <text x="250" y="78" fill="#94a3b8" font-size="7">BIGINT NN</text>
    <text x="12" y="93" fill="#fb7185" font-size="8" font-weight="600">FK</text>
    <text x="35" y="93" fill="#e2e8f0" font-size="8">vidro_id</text>
    <text x="250" y="93" fill="#94a3b8" font-size="7">BIGINT NULL</text>
    <text x="12" y="108" fill="#fb7185" font-size="8" font-weight="600">FK</text>
    <text x="35" y="108" fill="#e2e8f0" font-size="8">pelicula_id</text>
    <text x="250" y="108" fill="#94a3b8" font-size="7">BIGINT NULL</text>
    <text x="35" y="123" fill="#e2e8f0" font-size="8">linha_aluminio</text>
    <text x="250" y="123" fill="#94a3b8" font-size="7">VARCHAR(50) NULL</text>
    <text x="35" y="138" fill="#e2e8f0" font-size="8">largura_cm</text>
    <text x="250" y="138" fill="#94a3b8" font-size="7">NUMERIC(6,2) NN</text>
    <text x="35" y="153" fill="#e2e8f0" font-size="8">altura_cm</text>
    <text x="250" y="153" fill="#94a3b8" font-size="7">NUMERIC(6,2) NN</text>
    <text x="35" y="168" fill="#e2e8f0" font-size="8">quantidade</text>
    <text x="250" y="168" fill="#94a3b8" font-size="7">INTEGER NN = 1</text>
    
    <text x="35" y="188" fill="#fbbf24" font-size="7" font-weight="600">SNAPSHOT DE CUSTOS E TOTAIS</text>
    <text x="35" y="200" fill="#e2e8f0" font-size="8">custo_vidro</text>
    <text x="250" y="200" fill="#94a3b8" font-size="7">NUMERIC(10,2) NN = 0</text>
    <text x="35" y="215" fill="#e2e8f0" font-size="8">custo_aluminio, custo_ferragens</text>
    <text x="250" y="215" fill="#94a3b8" font-size="7">NUMERIC(10,2) NN = 0</text>
    <text x="35" y="230" fill="#e2e8f0" font-size="8">total_item</text>
    <text x="250" y="230" fill="#94a3b8" font-size="7">NUMERIC(10,2) NN = 0</text>
    <text x="35" y="245" fill="#e2e8f0" font-size="8">ordem</text>
    <text x="250" y="245" fill="#94a3b8" font-size="7">INTEGER NN</text>
    <line x1="10" y1="258" x2="410" y2="258" stroke="#fb923c" stroke-width="0.3"/>
    <text x="12" y="273" fill="#94a3b8" font-size="7">PK: id | FKs: orcamento_id, tipo_produto_id, vidro_id, pelicula_id</text>
  </g>

  <!-- Arrow orcamentos → itens_orcamento -->
  <line x1="580" y1="310" x2="580" y2="370" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="568" y="325" fill="#94a3b8" font-size="7">1</text>
  <text x="568" y="360" fill="#94a3b8" font-size="7">N</text>

  <!-- ======== ENTITY: materiais_item (bottom-right) ======== -->
  <g transform="translate(820, 395)">
    <rect width="260" height="205" rx="6" fill="#0f172a"/>
    <rect width="260" height="205" rx="6" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1.5"/>
    <rect width="260" height="28" rx="6" fill="rgba(251,146,60,0.5)" stroke="#fb923c" stroke-width="1.5"/>
    <text x="130" y="19" fill="white" font-size="11" font-weight="700" text-anchor="middle">materiais_item</text>
    <text x="12" y="48" fill="#fbbf24" font-size="8" font-weight="600">PK</text>
    <text x="35" y="48" fill="white" font-size="8" font-weight="600">id</text>
    <text x="150" y="48" fill="#94a3b8" font-size="7">BIGSERIAL</text>
    <text x="12" y="63" fill="#fb7185" font-size="8" font-weight="600">FK</text>
    <text x="35" y="63" fill="#e2e8f0" font-size="8">item_orcamento_id</text>
    <text x="150" y="63" fill="#94a3b8" font-size="7">BIGINT NN (CASCADE)</text>
    <text x="35" y="78" fill="#e2e8f0" font-size="8">tipo_material</text>
    <text x="150" y="78" fill="#34d399" font-size="7">ENUM NN</text>
    <text x="12" y="93" fill="#fb7185" font-size="8" font-weight="600">FK</text>
    <text x="35" y="93" fill="#e2e8f0" font-size="8">perfil_aluminio_id</text>
    <text x="150" y="93" fill="#94a3b8" font-size="7">BIGINT NULL</text>
    <text x="12" y="108" fill="#fb7185" font-size="8" font-weight="600">FK</text>
    <text x="35" y="108" fill="#e2e8f0" font-size="8">ferragem_id</text>
    <text x="150" y="108" fill="#94a3b8" font-size="7">BIGINT NULL</text>
    
    <text x="35" y="128" fill="#fbbf24" font-size="7" font-weight="600">SNAPSHOT</text>
    <text x="35" y="140" fill="#e2e8f0" font-size="8">quantidade</text>
    <text x="150" y="140" fill="#94a3b8" font-size="7">NUMERIC(10,3) NN</text>
    <text x="35" y="155" fill="#e2e8f0" font-size="8">preco_unitario</text>
    <text x="150" y="155" fill="#94a3b8" font-size="7">NUMERIC(10,2) NN</text>
    <text x="35" y="170" fill="#e2e8f0" font-size="8">custo_total</text>
    <text x="150" y="170" fill="#94a3b8" font-size="7">NUMERIC(10,2) NN</text>
    <line x1="10" y1="183" x2="250" y2="183" stroke="#fb923c" stroke-width="0.3"/>
    <text x="12" y="198" fill="#94a3b8" font-size="7">PK: id | FKs: item_orcamento_id...</text>
  </g>

  <!-- Arrow itens_orcamento → materiais_item -->
  <line x1="790" y1="500" x2="820" y2="500" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="795" y="493" fill="#94a3b8" font-size="7">1</text>
  <text x="810" y="493" fill="#94a3b8" font-size="7">N</text>

  <!-- ======== DECISION NOTES ======== -->
  <rect x="60" y="680" width="900" height="130" rx="8" fill="rgba(120,53,15,0.15)" stroke="#fbbf24" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="80" y="705" fill="#fbbf24" font-size="9" font-weight="600">Decisões de Design (Módulo Transacional)</text>

  <text x="80" y="725" fill="#fb923c" font-size="8">⬧ Desnormalização Controlada (Snapshot Pattern):</text>
  <text x="80" y="740" fill="#94a3b8" font-size="7">Os custos (custo_vidro, preco_unitario) são copiados do catálogo para as tabelas de itens no momento do orçamento.</text>
  <text x="80" y="755" fill="#94a3b8" font-size="7">Se o preço do vidro subir amanhã no catálogo, orçamentos antigos não podem ter seus valores alterados automaticamente.</text>

  <text x="80" y="775" fill="#34d399" font-size="8">⬧ ON DELETE CASCADE:</text>
  <text x="80" y="790" fill="#94a3b8" font-size="7">A exclusão (ou soft delete) de um `orcamento` ou `item_orcamento` propaga para `materiais_item`. O item_orcamento é uma "entidade fraca".</text>

</svg>
