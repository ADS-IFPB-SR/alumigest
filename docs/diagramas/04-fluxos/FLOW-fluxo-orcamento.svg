<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title -->
  <text x="30" y="35" fill="white" font-size="16" font-weight="700">Fluxo de Criação de Orçamento</text>
  <text x="30" y="52" fill="#94a3b8" font-size="9">Processo de negócio: Vendedor até Geração do PDF</text>

  <!-- =============================== -->
  <!-- SWIMLANES                       -->
  <!-- =============================== -->
  
  <!-- Swimlane 1: Vendedor (Frontend) -->
  <rect x="50" y="90" width="300" height="1050" fill="rgba(8,51,68,0.1)" stroke="#22d3ee" stroke-width="1" stroke-dasharray="8,4"/>
  <rect x="50" y="90" width="300" height="30" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
  <text x="200" y="110" fill="#22d3ee" font-size="11" font-weight="700" text-anchor="middle">Frontend (Vendedor)</text>

  <!-- Swimlane 2: Backend (Cálculo) -->
  <rect x="350" y="90" width="300" height="1050" fill="rgba(6,78,59,0.1)" stroke="#34d399" stroke-width="1" stroke-dasharray="8,4"/>
  <rect x="350" y="90" width="300" height="30" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1"/>
  <text x="500" y="110" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">Backend (Motor de Orçamento)</text>

  <!-- Swimlane 3: Banco de Dados -->
  <rect x="650" y="90" width="300" height="1050" fill="rgba(76,29,149,0.1)" stroke="#a78bfa" stroke-width="1" stroke-dasharray="8,4"/>
  <rect x="650" y="90" width="300" height="30" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1"/>
  <text x="800" y="110" fill="#a78bfa" font-size="11" font-weight="700" text-anchor="middle">Banco de Dados</text>


  <!-- =============================== -->
  <!-- NODES                           -->
  <!-- =============================== -->

  <!-- Start -->
  <rect x="125" y="150" width="150" height="40" rx="20" fill="#0f172a"/>
  <rect x="125" y="150" width="150" height="40" rx="20" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="200" y="174" fill="white" font-size="10" font-weight="600" text-anchor="middle">Iniciar Orçamento</text>

  <!-- Selecionar Cliente -->
  <rect x="125" y="230" width="150" height="50" rx="6" fill="#0f172a"/>
  <rect x="125" y="230" width="150" height="50" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="200" y="255" fill="white" font-size="10" font-weight="600" text-anchor="middle">Selecionar Cliente</text>
  <text x="200" y="270" fill="#94a3b8" font-size="8" text-anchor="middle">Buscar ou cadastrar</text>

  <line x1="200" y1="190" x2="200" y2="230" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Criar Cabecalho -->
  <rect x="425" y="230" width="150" height="50" rx="6" fill="#0f172a"/>
  <rect x="425" y="230" width="150" height="50" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="500" y="255" fill="white" font-size="10" font-weight="600" text-anchor="middle">Criar Cabeçalho</text>
  <text x="500" y="270" fill="#94a3b8" font-size="8" text-anchor="middle">Gerar número ORC-...</text>

  <line x1="275" y1="255" x2="425" y2="255" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- DB: Salvar Orcamento -->
  <g transform="translate(725, 220)">
    <rect x="0" y="10" width="150" height="50" rx="2" fill="#0f172a"/>
    <ellipse cx="75" cy="10" rx="75" ry="12" fill="#0f172a"/>
    <ellipse cx="75" cy="60" rx="75" ry="12" fill="#0f172a"/>
    <rect x="0" y="10" width="150" height="50" fill="rgba(76,29,149,0.4)"/>
    <ellipse cx="75" cy="10" rx="75" ry="12" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <ellipse cx="75" cy="60" rx="75" ry="12" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="0" y1="10" x2="0" y2="60" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="150" y1="10" x2="150" y2="60" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="75" y="40" fill="white" font-size="10" font-weight="600" text-anchor="middle">Tabela: orcamentos</text>
  </g>

  <line x1="575" y1="255" x2="725" y2="255" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Loop: Adicionar Itens -->
  <rect x="125" y="330" width="150" height="50" rx="6" fill="#0f172a"/>
  <rect x="125" y="330" width="150" height="50" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="200" y="355" fill="white" font-size="10" font-weight="600" text-anchor="middle">Configurar Item</text>
  <text x="200" y="370" fill="#94a3b8" font-size="8" text-anchor="middle">Tipo, Vidro, Medidas</text>

  <!-- Retorno DB para Front -->
  <path d="M 800,280 L 800,310 L 200,310 L 200,330" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- API Request -->
  <line x1="275" y1="355" x2="425" y2="355" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Motor de Cálculo -->
  <rect x="425" y="330" width="150" height="50" rx="6" fill="#0f172a"/>
  <rect x="425" y="330" width="150" height="50" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="500" y="355" fill="white" font-size="10" font-weight="600" text-anchor="middle">Calcular Custos</text>
  <text x="500" y="370" fill="#94a3b8" font-size="8" text-anchor="middle">Vidro, Alum, Ferragens</text>

  <!-- Consulta DB -->
  <path d="M 500,380 L 500,430 L 725,430" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="560" y="420" fill="#94a3b8" font-size="8">Buscar fórmulas/preços</text>

  <!-- DB: Catalog -->
  <g transform="translate(725, 395)">
    <rect x="0" y="10" width="150" height="50" rx="2" fill="#0f172a"/>
    <ellipse cx="75" cy="10" rx="75" ry="12" fill="#0f172a"/>
    <ellipse cx="75" cy="60" rx="75" ry="12" fill="#0f172a"/>
    <rect x="0" y="10" width="150" height="50" fill="rgba(76,29,149,0.4)"/>
    <ellipse cx="75" cy="10" rx="75" ry="12" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <ellipse cx="75" cy="60" rx="75" ry="12" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="0" y1="10" x2="0" y2="60" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="150" y1="10" x2="150" y2="60" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="75" y="40" fill="white" font-size="10" font-weight="600" text-anchor="middle">Tabelas Catálogo</text>
  </g>

  <!-- Snapshot DB -->
  <path d="M 800,465 L 800,530 L 575,530" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <rect x="425" y="505" width="150" height="50" rx="6" fill="#0f172a"/>
  <rect x="425" y="505" width="150" height="50" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="500" y="530" fill="white" font-size="10" font-weight="600" text-anchor="middle">Salvar Snapshot</text>
  <text x="500" y="545" fill="#94a3b8" font-size="8" text-anchor="middle">Congelar preços no item</text>

  <!-- DB: itens_orcamento -->
  <path d="M 500,555 L 500,600 L 725,600" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <g transform="translate(725, 565)">
    <rect x="0" y="10" width="150" height="50" rx="2" fill="#0f172a"/>
    <ellipse cx="75" cy="10" rx="75" ry="12" fill="#0f172a"/>
    <ellipse cx="75" cy="60" rx="75" ry="12" fill="#0f172a"/>
    <rect x="0" y="10" width="150" height="50" fill="rgba(76,29,149,0.4)"/>
    <ellipse cx="75" cy="10" rx="75" ry="12" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <ellipse cx="75" cy="60" rx="75" ry="12" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="0" y1="10" x2="0" y2="60" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="150" y1="10" x2="150" y2="60" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="75" y="40" fill="white" font-size="10" font-weight="600" text-anchor="middle">itens_ / materiais_</text>
  </g>

  <!-- Recalcular Totais -->
  <path d="M 800,635 L 800,680 L 575,680" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="425" y="655" width="150" height="50" rx="6" fill="#0f172a"/>
  <rect x="425" y="655" width="150" height="50" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="500" y="680" fill="white" font-size="10" font-weight="600" text-anchor="middle">Recalcular Orçamento</text>
  <text x="500" y="695" fill="#94a3b8" font-size="8" text-anchor="middle">Somar todos os itens</text>

  <!-- Atualiza DB orcamento -->
  <path d="M 575,690 L 875,690 L 875,245 L 800,245" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- DB to Front -->
  <path d="M 425,670 L 200,670 L 200,720" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="310" y="660" fill="#94a3b8" font-size="8">Retorna Totais</text>

  <!-- Decision: Mais Itens? -->
  <g transform="translate(200, 755)">
    <polygon points="0,-35 60,0 0,35 -60,0" fill="#0f172a"/>
    <polygon points="0,-35 60,0 0,35 -60,0" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <text y="4" fill="white" font-size="9" font-weight="600" text-anchor="middle">Mais Itens?</text>
  </g>

  <!-- Yes -> loop back -->
  <path d="M 140,755 L 90,755 L 90,355 L 125,355" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="110" y="550" fill="#34d399" font-size="9">Sim</text>

  <!-- No -> continue -->
  <line x1="200" y1="790" x2="200" y2="830" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="210" y="810" fill="#fb7185" font-size="9">Não</text>

  <!-- Aplicar Desconto -->
  <rect x="125" y="830" width="150" height="50" rx="6" fill="#0f172a"/>
  <rect x="125" y="830" width="150" height="50" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="200" y="855" fill="white" font-size="10" font-weight="600" text-anchor="middle">Aplicar Desconto</text>
  <text x="200" y="870" fill="#94a3b8" font-size="8" text-anchor="middle">Opcional (%)</text>

  <line x1="275" y1="855" x2="425" y2="855" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Finalizar/Gerar PDF -->
  <rect x="425" y="830" width="150" height="50" rx="6" fill="#0f172a"/>
  <rect x="425" y="830" width="150" height="50" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="500" y="855" fill="white" font-size="10" font-weight="600" text-anchor="middle">Aprovar / Enviar PDF</text>
  <text x="500" y="870" fill="#94a3b8" font-size="8" text-anchor="middle">Mudar Status</text>

  <!-- Save Status -->
  <path d="M 575,845 L 860,845 L 860,265 L 800,265" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Generate PDF -->
  <line x1="500" y1="880" x2="500" y2="920" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="425" y="920" width="150" height="50" rx="6" fill="#0f172a"/>
  <rect x="425" y="920" width="150" height="50" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="500" y="945" fill="white" font-size="10" font-weight="600" text-anchor="middle">Gerador PDF (iText)</text>
  <text x="500" y="960" fill="#94a3b8" font-size="8" text-anchor="middle">Construir documento</text>

  <!-- Retorna PDF -->
  <path d="M 425,945 L 200,945 L 200,980" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Fim -->
  <rect x="125" y="980" width="150" height="40" rx="20" fill="#0f172a"/>
  <rect x="125" y="980" width="150" height="40" rx="20" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="200" y="1004" fill="white" font-size="10" font-weight="600" text-anchor="middle">Download PDF / Fim</text>

</svg>
