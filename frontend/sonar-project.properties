sonar.projectKey=alumigest-frontend
sonar.projectName=AlumiGest Frontend

# Diretório de fontes
sonar.sources=src

# Exclusões da análise
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.test.*,**/*.spec.*

# Caminhos dos tsconfig para resolução de tipos
sonar.typescript.tsconfigPaths=tsconfig.json,tsconfig.app.json

# Encoding
sonar.sourceEncoding=UTF-8

# Testes e Relatório de Cobertura (LCOV gerado pelo Vitest)
sonar.tests=src/__tests__
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/node_modules/**,**/dist/**,**/*.test.*,**/*.spec.*,src/test/**,src/main.tsx,src/vite-env.d.ts
