sonar.projectKey=alumigest-frontend
sonar.projectName=AlumiGest Frontend
sonar.sources=src

# Exclusões da análise
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.test.*,**/*.spec.*

# Caminhos dos tsconfig para resolução de tipos
sonar.typescript.tsconfigPaths=tsconfig.json,tsconfig.app.json

# Encoding
sonar.sourceEncoding=UTF-8

# Testes e Relatório de Cobertura (LCOV gerado pelo Vitest)
sonar.tests=src/__tests__
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/node_modules/**,**/dist/**,**/*.test.*,**/*.spec.*,src/test/**,src/main.tsx,src/App.tsx,src/vite-env.d.ts,src/pages/**,src/components/layout/**,**/types/**,**/*.types.ts,**/index.ts,**/index.tsx,**/*Theme.ts,**/*Theme.tsx,**/constants.ts,**/templates/**,**/*Renderer*.tsx,**/*TechSheet*.tsx,**/*Tab.tsx
